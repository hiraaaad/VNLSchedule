[project]
name = "vnl-schedule"
version = "0.1.0"
description = "Local printable Volleyball Nations League schedule PDF app."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "playwright>=1.50",
    "pydantic>=2.10",
    "python-dateutil>=2.9",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
